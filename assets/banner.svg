 <path d="M520 190 Q528 214 540 232" stroke="#fff" stroke-opacity=".0" fill="none"/>
 <polygon points="640,115.0 666,115.0 640,128 614,115.0" fill="#a9c3ff"/><polygon points="614,115.0 640,128 640,166 614,153.0" fill="#3f66ff"/><polygon points="640,128 666,115.0 666,153.0 640,166" fill="#2a46c8"/><polygon points="606,133.0 624,133.0 606,142 588,133.0" fill="#b9a8ff"/><polygon points="588,133.0 606,142 606,168 588,159.0" fill="#6a4cff"/><polygon points="606,142 624,133.0 624,159.0 606,168" fill="#4a32c3"/><polygon points="672,138.5 687,138.5 672,146 657,138.5" fill="#9dd0ff"/><polygon points="657,138.5 672,146 672,168 657,160.5" fill="#2f86ff"/><polygon points="672,146 687,138.5 687,160.5 672,168" fill="#1f5fd0"/>
 <circle cx="640" cy="150" r="46" fill="url(#glow)" class="pulse"/>
 <rect x="738" y="112" width="8" height="62" rx="3" fill="#e9e1d8"/><rect x="734" y="104" width="16" height="10" rx="3" fill="#d8cfc4"/>
 <g class="blades"><g fill="#f3f0fa" stroke="#8f86a8" stroke-width="1"><rect x="739" y="78" width="6" height="32" rx="2"/><rect x="739" y="114" width="6" height="32" rx="2"/><rect x="706" y="109" width="32" height="6" rx="2"/><rect x="746" y="109" width="32" height="6" rx="2"/></g></g>
 <circle cx="742" cy="112" r="5" fill="#ff8a1f"/>
 <g clip-path="url(#fall)"><g class="stream" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="2" opacity=".85"><path d="M742 160v10M746 150v12M750 164v10M742 178v10M746 174v12M750 188v10M742 196v10M746 198v12M750 208v10M742 214v10M746 218v12M750 226v10"/></g></g>
