</g>

<text x="48" y="94" font-size="46" font-weight="800" fill="#fff" letter-spacing="-1.5">Hii, I'm</text>
<text x="46" y="156" font-size="64" font-weight="900" fill="#ff7a1a" letter-spacing="-2"><tspan fill="#fff">Y </tspan>ESWAR</text>
<g class="mono" font-size="17" font-weight="600" fill="#fff">
 <text class="role r1" x="50" y="196" style="animation-delay:0s">&gt; Data Scientist</text>
 <text class="role r2" x="50" y="196">&gt; ML Engineer</text>
 <text class="role r3" x="50" y="196">&gt; Researcher</text>
 <text class="role r4" x="50" y="196">&gt; Gen AI builder</text>
 <text class="role r5" x="50" y="196">&gt; Data Analyst</text>
</g>
<text x="50" y="236" font-size="17" fill="#fff" opacity=".95">I build things with data, code and a curious mind.</text>
<g><rect x="48" y="256" width="206" height="38" rx="19" fill="url(#cta)" stroke="#fff" stroke-opacity=".8"/><text x="151" y="280" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">ishuu.me  →</text></g>
</svg>