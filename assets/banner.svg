<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" role="img" aria-label="Banner: Hii, I'm Y Eswar. Data scientist, ML engineer and researcher. A floating island with a glowing lab, waterfall and a spinning wind turbine.">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f4fff"/><stop offset=".55" stop-color="#4f95ff"/><stop offset="1" stop-color="#9fd0ff"/></linearGradient>
<linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c79aa0"/><stop offset="1" stop-color="#7b5461"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#ffd68a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd68a" stop-opacity="0"/></radialGradient>
<linearGradient id="cta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b6bff"/><stop offset="1" stop-color="#1237c8"/></linearGradient>
<clipPath id="fall"><rect x="739" y="176" width="12" height="62"/></clipPath>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.d1{animation:drift 22s ease-in-out infinite alternate}
.d2{animation:drift 30s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(22px)}}
.bob{animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.blades{transform-origin:742px 112px;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stream{animation:stream .9s linear infinite}
@keyframes stream{to{transform:translateY(16px)}}
.pulse{animation:pulse 3.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.8}}
.role{opacity:0;animation:role 12.5s infinite}
.r2{animation-delay:2.5s}.r3{animation-delay:5s}.r4{animation-delay:7.5s}.r5{animation-delay:10s}
@keyframes role{0%{opacity:0;transform:translateY(8px)}4%,18%{opacity:1;transform:none}22%,100%{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.r1{opacity:1}}
</style></defs>
<rect width="860" height="320" fill="url(#sky)"/>
<g class="d1"><g transform="translate(470 38) scale(0.8)" fill="#fff" opacity="0.85"><circle cx="0" cy="0" r="26"/><circle cx="28" cy="-10" r="32"/><circle cx="62" cy="0" r="26"/><circle cx="30" cy="8" r="30"/></g><g transform="translate(800 95) scale(0.9)" fill="#fff" opacity="0.9"><circle cx="0" cy="0" r="26"/><circle cx="28" cy="-10" r="32"/><circle cx="62" cy="0" r="26"/><circle cx="30" cy="8" r="30"/></g></g>
<g class="d2"><g transform="translate(430 305) scale(1.3)" fill="#fff" opacity="0.95"><circle cx="0" cy="0" r="26"/><circle cx="28" cy="-10" r="32"/><circle cx="62" cy="0" r="26"/><circle cx="30" cy="8" r="30"/></g><g transform="translate(580 292) scale(1.7)" fill="#fff" opacity="0.95"><circle cx="0" cy="0" r="26"/><circle cx="28" cy="-10" r="32"/><circle cx="62" cy="0" r="26"/><circle cx="30" cy="8" r="30"/></g><g transform="translate(790 282) scale(1.3)" fill="#fff" opacity="0.95"><circle cx="0" cy="0" r="26"/><circle cx="28" cy="-10" r="32"/><circle cx="62" cy="0" r="26"/><circle cx="30" cy="8" r="30"/></g></g>
<g class="bob">
